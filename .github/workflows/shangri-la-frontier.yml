name: Shangri-La Frontier mod

on:
  push:
    paths:
      - 'shangri-la-frontier/**'
      - '.github/workflows/shangri-la-frontier.yml'
  pull_request:
    paths:
      - 'shangri-la-frontier/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shangri-la-frontier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-configuration-cache

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: slfrontier-jar
          path: shangri-la-frontier/build/libs/*.jar

      - name: Install NeoForge dedicated server
        run: |
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir -p ../server && cd ../server
          curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEO}/neoforge-${NEO}-installer.jar"
          java -jar installer.jar --installServer . > installer.log 2>&1 || (tail -50 installer.log; exit 1)
          mkdir -p mods
          cp ../shangri-la-frontier/build/libs/*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > server.properties

      - name: Boot server and exercise the Frontier dimension
        run: python3 tools/ci_boot_test.py ../server

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server/logs/
          if-no-files-found: ignore
