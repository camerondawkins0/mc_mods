name: Shangri-La Frontier mod

on:
  push:
    paths:
      - 'shangri-la-frontier/**'
      - '.github/workflows/shangri-la-frontier.yml'
  pull_request:
    paths:
      - 'shangri-la-frontier/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shangri-la-frontier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-configuration-cache

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: slfrontier-jar
          path: shangri-la-frontier/build/libs/*.jar

      - name: Install NeoForge dedicated server
        run: |
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir -p ../server && cd ../server
          curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEO}/neoforge-${NEO}-installer.jar"
          java -jar installer.jar --installServer . > installer.log 2>&1 || (tail -50 installer.log; exit 1)
          mkdir -p mods
          cp ../shangri-la-frontier/build/libs/*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > server.properties

      - name: Boot server and exercise the Frontier dimension
        run: python3 tools/ci_boot_test.py ../server

      - name: Prepare client test world
        if: always()
        run: |
          test -d ../server/world || exit 0
          mkdir -p run/saves
          rm -rf run/saves/ci_world
          cp -r ../server/world run/saves/ci_world
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nnarrator:0\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nrenderDistance:6\nsimulationDistance:6\nguiScale:2\nsoundCategory_master:0.0\n' > run/options.txt

      - name: Client walkthrough (virtual display, screenshots)
        if: always()
        run: |
          test -d run/saves/ci_world || exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientTest --no-configuration-cache > client.log 2>&1 || echo "client exited with $?"
          grep -E "Client test|Screenshot|/ERROR|Exception|Missing texture|Unable to load|FAILED|was not applied|Mixin|OpenGL|quick|Quick|Loading|world" client.log | grep -v "flite\|OpenAL" | head -300 || true
          echo "===== client.log tail ====="
          tail -n 80 client.log
          pip install -q pillow
          test -d run/screenshots && python3 tools/ci_screens.py run/screenshots || echo "no screenshots"
          grep -q "Client test finished" client.log

      - name: Upload client log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test
          path: |
            shangri-la-frontier/client.log
            shangri-la-frontier/run/screenshots/
            shangri-la-frontier/run/logs/
          if-no-files-found: ignore

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server/logs/
          if-no-files-found: ignore
