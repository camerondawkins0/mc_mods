plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Minecraft 26.2 ships Java 25 to players, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // CI only: launches a client into a prepared world, takes screenshots and quits.
        clientTest {
            client()
            systemProperty 'slfrontier.clientTest', 'true'
            // ./gradlew runClientTest -PslfScenes=weapons,menus runs only those scenes
            systemProperty 'slfrontier.clientTest.only', (project.findProperty('slfScenes') ?: '').toString()
            // Companion mods (Sodium, Iris) still use the old logoFile key, which opens a
            // dev-only warning screen that would stop the test before the world loads.
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'ci_world', '--width', '1280', '--height', '720'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
